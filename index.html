<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#161E22">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="作業部屋">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<title>ドットの作業部屋</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DotGothic16&family=Zen+Kaku+Gothic+New:wght@400;500;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
:root{
  color-scheme:dark;
  --bg:#161E22; --surface:#1F2B30; --sunk:#182226; --ink:#E6E4D8; --muted:#9AA8A4;
  --line:#33434A; --accent:#E8C98A; --accent-ink:#231A0C; --accent-soft:#3A3526; --good:#8CCB9E; --bad:#E7806F;
  --pixel:"DotGothic16","Zen Kaku Gothic New",monospace;
  --sans:"Zen Kaku Gothic New","Hiragino Sans","Noto Sans JP",system-ui,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
}
:root[data-world="neon"]{
  --bg:#120E2A; --surface:#1D1742; --sunk:#16113A; --ink:#EEE8FF; --muted:#A99FD6;
  --line:#352C6E; --accent:#5FF5D0; --accent-ink:#0B2320; --accent-soft:#1B3A46; --good:#5FF5D0; --bad:#FF6FA8;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:14px;line-height:1.55;padding:0 16px;transition:background .4s}
.wrap{max-width:1100px;margin:0 auto;padding-block:18px 40px;display:flex;flex-direction:column;gap:12px}
header{display:flex;align-items:center;justify-content:space-between;gap:10px 16px;flex-wrap:wrap}
h1{font-family:var(--pixel);font-weight:400;font-size:22px;margin:0;letter-spacing:.06em}
.worlds{display:flex;gap:4px;background:var(--sunk);border:1px solid var(--line);border-radius:6px;padding:3px}
.worlds button{font-family:var(--pixel);border:0;background:transparent;color:var(--muted);padding:5px 12px}
.worlds button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.stage{position:relative;border:2px solid var(--line);border-radius:4px;overflow:hidden;background:var(--sunk);line-height:0;display:flex;justify-content:center}
canvas{image-rendering:pixelated;image-rendering:crisp-edges;display:block;touch-action:manipulation;flex:none}
#tip{position:absolute;pointer-events:none;font-family:var(--pixel);font-size:13px;line-height:1.3;background:var(--bg);color:var(--ink);border:1px solid var(--accent);padding:3px 8px;border-radius:2px;white-space:nowrap;transform:translate(-50%,-130%)}
.hint{font-size:12px;color:var(--muted)}
.status{display:flex;flex-wrap:wrap;gap:6px 18px;font-family:var(--pixel);font-size:14px;color:var(--muted)}
.status b{color:var(--ink);font-weight:400;font-family:var(--mono);font-variant-numeric:tabular-nums}
.status .on{color:var(--accent)}
.objs{display:flex;flex-wrap:wrap;gap:6px}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:1px solid var(--line);background:var(--surface);border-radius:4px;padding:6px 12px;line-height:1.3}
button:hover{border-color:var(--accent)}
.objs button{font-family:var(--pixel);font-size:13px}
button.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:700}
button.ghost{background:transparent;border-color:transparent;color:var(--muted);padding:4px 7px}
button.ghost:hover{color:var(--ink);border-color:var(--line)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
input[type=text],input[type=search],input[type=number],input[type=date],input[type=url],textarea{background:var(--sunk);border:1px solid var(--line);border-radius:4px;padding:6px 8px;min-width:0}
#panel{position:fixed;top:0;right:0;bottom:0;width:min(380px,100%);background:var(--surface);border-left:2px solid var(--line);display:flex;flex-direction:column;z-index:10;box-shadow:-12px 0 32px rgba(0,0,0,.4);padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (max-width:640px){#panel{top:auto;left:0;width:100%;max-height:72%;border-left:0;border-top:2px solid var(--line);border-radius:10px 10px 0 0}}
.p-h{display:flex;align-items:center;justify-content:space-between;padding:12px 14px;border-bottom:1px solid var(--line)}
.p-h h2{font-family:var(--pixel);font-weight:400;font-size:18px;margin:0}
.p-b{padding:14px;overflow:auto;display:flex;flex-direction:column;gap:12px}
.sec{display:flex;flex-direction:column;gap:8px}
.sec + .sec{border-top:1px dashed var(--line);padding-top:12px}
.lbl{font-family:var(--pixel);font-size:13px;color:var(--muted);letter-spacing:.05em}
.big{font-family:var(--mono);font-variant-numeric:tabular-nums;font-size:38px;font-weight:500;line-height:1.1}
.sub{color:var(--muted);font-size:12px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.row > input[type=text],.row > input[type=url],.row > input[type=search]{flex:1}
.pill{font-family:var(--pixel);font-size:12px;padding:1px 8px;border-radius:2px;background:var(--accent-soft);color:var(--accent)}
.bar{height:6px;background:var(--sunk);border:1px solid var(--line)}
.bar i{display:block;height:100%;background:var(--accent);width:0}
ul.list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:2px}
ul.list li{display:flex;align-items:center;gap:8px;padding:4px 2px;border-radius:4px}
ul.list li:hover{background:var(--sunk)}
ul.list li span.t{flex:1;overflow-wrap:anywhere}
ul.list li.done span.t{color:var(--muted);text-decoration:line-through}
ul.list li a{flex:1;color:var(--accent);overflow-wrap:anywhere}
textarea.memo{width:100%;min-height:220px;resize:vertical;line-height:1.7}
.hist{font-family:var(--mono);font-size:12px;color:var(--muted);display:flex;flex-direction:column;gap:2px;max-height:120px;overflow:auto}
.empty{color:var(--muted);font-size:13px;margin:0}
input[type=range]{accent-color:var(--accent);flex:1}
label.chk{display:flex;gap:8px;align-items:center;cursor:pointer}
.slider{display:grid;grid-template-columns:5.5em 1fr;gap:8px;align-items:center}
.hud{display:none}
body.crop .stage{justify-content:flex-start}
.crophint{display:none;font-size:12px;color:var(--muted)}
body.crop .crophint{display:block}
body.full{padding:0;overflow:hidden}
body.full .wrap{padding:0;max-width:none;gap:0}
body.full header,body.full .status,body.full .objs,body.full .hint,body.full .crophint{display:none}
body.full .stage{position:fixed;inset:0;border:0;border-radius:0;align-items:center;padding:env(safe-area-inset-top,0px) env(safe-area-inset-right,0px) env(safe-area-inset-bottom,0px) env(safe-area-inset-left,0px)}
body.full .hud{display:flex;position:fixed;top:calc(env(safe-area-inset-top,0px) + 8px);left:calc(env(safe-area-inset-left,0px) + 8px);gap:6px;z-index:5;align-items:center;flex-wrap:wrap;max-width:calc(100% - 16px)}
.hud button{font-family:var(--pixel);font-size:12px;padding:4px 10px;background:color-mix(in srgb,var(--bg) 80%,transparent)}
#hudStatus{font-family:var(--pixel);font-size:12px;color:var(--muted);display:flex;gap:10px;background:color-mix(in srgb,var(--bg) 70%,transparent);padding:3px 8px;border-radius:4px}
#hudStatus b{color:var(--ink);font-weight:400}#hudStatus .on{color:var(--accent)}
#hudObjs{position:fixed;top:calc(env(safe-area-inset-top,0px) + 44px);left:calc(env(safe-area-inset-left,0px) + 8px);z-index:6;display:flex;flex-direction:column;gap:4px;background:var(--surface);border:1px solid var(--line);padding:8px;border-radius:6px;max-height:70vh;overflow:auto}
#hudObjs button{font-family:var(--pixel);font-size:13px;text-align:left}
.tabs{display:flex;gap:2px;background:var(--sunk);border:1px solid var(--line);border-radius:6px;padding:2px;width:max-content}
.tabs button{border:0;background:transparent;color:var(--muted);padding:4px 12px;font-family:var(--pixel);font-size:13px}
.tabs button[aria-selected="true"]{background:var(--accent);color:var(--accent-ink)}
.tiles{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.tile{background:var(--sunk);border:1px solid var(--line);border-radius:6px;padding:8px 10px}
.tv{font-family:var(--mono);font-variant-numeric:tabular-nums;font-size:20px;line-height:1.2}
.chartwrap{width:100%}
.chart{width:100%;height:auto;display:block}
.chart .grid{stroke:var(--line);stroke-width:1;stroke-dasharray:2 3}
.chart .base{stroke:var(--muted);stroke-width:1}
.chart .ax{fill:var(--muted);font-size:10px;font-family:var(--mono)}
.chart .ax.now{fill:var(--ink)}
.chart .bar{fill:var(--accent);opacity:.8}
.chart .bar.today{opacity:1}
.chart rect:hover{fill:color-mix(in srgb,var(--ink) 6%,transparent)}
.ctip{font-size:12px;color:var(--ink);min-height:1.5em}
.tbl{display:flex;flex-direction:column;gap:2px;max-height:220px;overflow:auto;font-size:13px}
.tbl .tr{display:flex;justify-content:space-between;border-bottom:1px dashed var(--line);padding:2px 0}
.tbl b{font-weight:400;font-family:var(--mono);font-variant-numeric:tabular-nums}
input.file{position:absolute;width:1px;height:1px;opacity:0;pointer-events:none}
.filebtn{display:inline-block;width:max-content;cursor:pointer;border:1px solid var(--accent);color:var(--accent);border-radius:4px;padding:6px 12px}
.np{display:flex;flex-direction:column;gap:6px;background:var(--sunk);border:1px solid var(--line);border-radius:6px;padding:10px}
.track{font-family:var(--pixel);font-size:15px;overflow-wrap:anywhere}
ul.list li.cur{background:var(--accent-soft)}
.tm{font-family:var(--mono);font-variant-numeric:tabular-nums;font-size:12px;color:var(--muted);white-space:nowrap}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums;white-space:nowrap}
.pill.warn{background:color-mix(in srgb,var(--bad) 22%,transparent);color:var(--bad)}
input[type=time]{background:var(--sunk);border:1px solid var(--line);border-radius:4px;padding:6px 8px}
select{background:var(--sunk);border:1px solid var(--line);border-radius:4px;padding:6px 8px;color:var(--ink);font:inherit;max-width:100%}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.fld{display:flex;flex-direction:column;gap:2px}.fld input{width:100%}
li.todo{align-items:flex-start}
.tb{flex:1;display:flex;flex-direction:column;gap:3px;min-width:0}
.chips{display:flex;flex-wrap:wrap;gap:4px}
.chip{font-size:11px;padding:1px 6px;border:1px solid var(--line);border-radius:3px;background:var(--sunk);color:var(--muted);line-height:1.5}
.chip input,.chip select{font-size:11px;padding:0;border:0;background:transparent;color:inherit}
select.chip{padding:1px 4px}
.chip.p1{color:var(--bad);border-color:color-mix(in srgb,var(--bad) 50%,transparent)}
.chip.p2{color:var(--accent)}
.chip.warn{color:var(--bad);border-color:var(--bad)}
.chip.s0{color:var(--muted)}.chip.s1{color:var(--accent);border-color:var(--accent)}.chip.s2{color:var(--good);border-color:var(--good)}
.hbars{display:flex;flex-direction:column;gap:6px}
.hrow{display:grid;grid-template-columns:minmax(0,9em) 1fr auto;gap:8px;align-items:center;font-size:12px}
.hn{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ht{height:10px;background:var(--sunk);border-radius:2px;overflow:hidden}.ht i{display:block;height:100%;background:var(--accent);border-radius:0 3px 3px 0}
.hrow b{font-weight:400;font-family:var(--mono);font-variant-numeric:tabular-nums}
.chap{display:flex;flex-direction:column;gap:4px;padding:8px 0;border-bottom:1px dashed var(--line)}
input.plain{background:transparent;border:1px solid transparent;font-weight:700;flex:1}input.plain:hover,input.plain:focus{border-color:var(--line)}
.bar.wide{height:10px}
.ptitle{text-align:left;color:var(--ink);font-weight:700;padding:0;border:0}
.clip{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
textarea.memo.small{min-height:110px}
.hgrid{display:grid;grid-template-columns:minmax(6em,1fr) repeat(7,32px) 3.5em 28px;gap:4px;align-items:center;overflow-x:auto}
.hd{font-size:11px;color:var(--muted);text-align:center}.hd.now{color:var(--accent)}
.hcell{width:30px;height:30px;padding:0;display:grid;place-items:center;font-family:var(--mono)}
.swatch{width:16px;height:16px;min-width:16px;padding:0;border:1px solid rgba(0,0,0,.35);border-radius:2px;flex:none;cursor:pointer}
.hn{display:flex;align-items:center;gap:6px}
.hcell.on{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.hs{font-family:var(--mono);font-size:12px;color:var(--muted);text-align:right}
@media (max-width:520px){.hgrid{grid-template-columns:minmax(5em,1fr) repeat(7,26px) 3em 24px}.hcell{width:26px;height:26px}}
#pc{position:fixed;inset:0;z-index:20;background:rgba(12,9,6,.72);display:flex;align-items:center;justify-content:center;padding:max(10px,env(safe-area-inset-top,0px)) 10px max(10px,env(safe-area-inset-bottom,0px))}
.crt{width:min(980px,100%);height:min(690px,100%);background:linear-gradient(#e4dcc8,#cfc5ae);border-radius:16px;padding:18px 18px 8px;box-shadow:inset 0 2px 0 #f5efe1,inset 0 -3px 0 #a79c84,0 24px 60px rgba(0,0,0,.55);display:flex;flex-direction:column;gap:6px}
.desk{position:relative;flex:1;min-height:0;border-radius:8px;overflow:hidden;background:radial-gradient(ellipse at 50% 40%,#4a8a86,#35706c 70%,#2b5c59);box-shadow:inset 0 0 0 3px #26231e,inset 0 0 50px rgba(0,0,0,.4);font-family:var(--pixel);color:#fff}
.desk::after{content:'';position:absolute;inset:0;pointer-events:none;z-index:9;background:repeating-linear-gradient(0deg,rgba(0,0,0,.07) 0 1px,transparent 1px 3px)}
.crtlabel{display:flex;align-items:center;justify-content:space-between;padding:0 8px;color:#7a705c;font-family:var(--pixel);font-size:12px}
.brand{letter-spacing:.2em}.ctrls{display:flex;align-items:center;gap:10px}
.led{width:8px;height:8px;border-radius:50%;background:#86d686;box-shadow:0 0 6px #86d686}
.pwr{background:#d8cfba;border:1px solid #a79c84;border-radius:3px;color:#4a4336;font-family:var(--pixel);font-size:12px;padding:3px 10px;box-shadow:inset 0 1px 0 #f5efe1}
.dicons{position:absolute;top:10px;left:10px;bottom:44px;display:grid;grid-auto-flow:column;grid-template-rows:repeat(auto-fill,80px);gap:4px 10px;align-content:start}
.dicon{width:84px;display:flex;flex-direction:column;align-items:center;gap:5px;background:transparent;border:1px dotted transparent;color:#fff;padding:4px 2px;font-size:12px;border-radius:0}
.dicon:hover{border-color:transparent}.dicon .dl{text-shadow:1px 1px 0 #16302f;line-height:1.3;text-align:center;padding:0 2px}
.dicon:hover .dl,.dicon.sel .dl{background:#0a246a;text-shadow:none}.dicon:focus-visible{border-color:#fff;outline:none}
.glyph{width:36px;height:36px;display:grid;place-items:center;font-family:var(--pixel);font-size:19px;color:#1d2326;background:var(--c);border:2px solid color-mix(in srgb,var(--c) 55%,#000);box-shadow:inset -3px -3px 0 color-mix(in srgb,var(--c) 70%,#000),inset 3px 3px 0 color-mix(in srgb,var(--c) 55%,#fff)}
.glyph.s{width:22px;height:22px;font-size:12px;border-width:1px;box-shadow:inset -2px -2px 0 color-mix(in srgb,var(--c) 70%,#000),inset 2px 2px 0 color-mix(in srgb,var(--c) 55%,#fff)}
.win{position:absolute;left:12%;top:5%;right:5%;bottom:calc(36px + 4%);z-index:2;display:flex;flex-direction:column;background:#d4d0c8;border:2px solid;border-color:#ffffff #404040 #404040 #ffffff;box-shadow:1px 1px 0 #000,6px 8px 18px rgba(0,0,0,.35);color:#000}
.win.max{left:0;top:0;right:0;bottom:34px}
.tbar{display:flex;align-items:center;gap:6px;padding:3px 3px 3px 5px;background:linear-gradient(90deg,#0a246a,#3a6ea5);color:#fff;font-size:13px;user-select:none}
.ttl{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tglyph{width:16px;height:16px;display:grid;place-items:center;font-size:10px;background:var(--c);color:#1d2326}
.wbtn{width:22px;height:19px;padding:0;display:grid;place-items:center;background:#d4d0c8;color:#000;border:2px solid;border-color:#fff #404040 #404040 #fff;border-radius:0;font-size:11px;line-height:1;font-family:var(--mono);font-weight:700}
.wbtn:active{border-color:#404040 #fff #fff #404040}
.client{flex:1;overflow:auto;margin:3px;padding:14px;border:2px solid;border-color:#808080 #fff #fff #808080;--bg:#f5f2e9;--surface:#ebe7db;--sunk:#fffdf8;--ink:#1c1b18;--muted:#5c574c;--line:#a39d8f;--accent:#0a246a;--accent-ink:#ffffff;--accent-soft:#d9dff0;--good:#1c6b2a;--bad:#a3261c;background:var(--bg);color:var(--ink);font-family:var(--sans)}
.client .appwin,.client{display:flex;flex-direction:column;gap:12px}
.client button{border-radius:0;background:#d4d0c8;color:#000;border:2px solid;border-color:#fff #404040 #404040 #fff}
.client button:hover{border-color:#fff #404040 #404040 #fff}
.client button:active{border-color:#404040 #fff #fff #404040}
.client button.primary{font-weight:700;outline:1px dotted #000;outline-offset:-5px}
.client button.ghost{background:transparent;border-color:transparent;color:var(--muted)}
.client input[type=text],.client input[type=search],.client input[type=number],.client input[type=date],.client input[type=url],.client input[type=time],.client textarea,.client select{border-radius:0;border:2px solid;border-color:#808080 #fff #fff #808080;background:#fff;color:#000}
.client .tabs{border-radius:0;background:#d4d0c8;border:0;padding:0;gap:0}
.client .tabs button{border:2px solid;border-color:#fff #404040 #404040 #fff;color:#000;font-family:var(--pixel)}
.client .tabs button[aria-selected="true"]{background:#fff;color:#000;border-color:#404040 #fff #fff #404040}
.client .tile,.client .np{border-radius:0;background:#fff;border:2px solid;border-color:#808080 #fff #fff #808080}
.client .chip{border-radius:0}.client .filebtn{border-radius:0}
.client .hcell{width:30px}
.smenu{position:absolute;left:3px;bottom:34px;width:240px;display:flex;z-index:4;background:#d4d0c8;border:2px solid;border-color:#fff #404040 #404040 #fff;box-shadow:1px 1px 0 #000;color:#000}
.sside{writing-mode:vertical-rl;transform:rotate(180deg);background:linear-gradient(0deg,#0a246a,#3a6ea5);color:#fff;padding:8px 5px;font-size:14px;letter-spacing:.15em}
.sitems{flex:1;display:flex;flex-direction:column;padding:2px}
.sitem{display:flex;align-items:center;gap:8px;background:transparent;border:0;color:#000;text-align:left;padding:5px 8px;font-family:var(--pixel);font-size:13px;border-radius:0}
.sitem:hover{background:#0a246a;color:#fff;border:0}
.smenu hr{border:0;border-top:1px solid #808080;border-bottom:1px solid #fff;margin:3px 2px}
.taskbar{position:absolute;left:0;right:0;bottom:0;height:32px;z-index:3;display:flex;align-items:center;gap:4px;padding:3px;background:#d4d0c8;border-top:2px solid #fff;box-shadow:0 -1px 0 #dfdfdf;color:#000;font-size:12px}
.startb{display:flex;align-items:center;gap:6px;height:25px;padding:0 8px;background:#d4d0c8;color:#000;border:2px solid;border-color:#fff #404040 #404040 #fff;border-radius:0;font-family:var(--pixel);font-weight:700}
.startb.on{border-color:#404040 #fff #fff #404040}
.sico{width:13px;height:13px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#fff0bf,#e8a24a 60%,#b86a2a)}
.tasks{flex:1;display:flex;gap:4px;min-width:0}
.taskb{max-width:170px;height:25px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;background:#d4d0c8;color:#000;border:2px solid;border-color:#fff #404040 #404040 #fff;border-radius:0;font-family:var(--pixel);font-size:12px;padding:0 8px}
.taskb.on{border-color:#404040 #fff #fff #404040;background:#e8e5de;font-weight:700}

  <div class="p-b" id="pBody"></div>

<script>
(function(){
/* ================= state ================= */
const LS='pixelroom.iso.v1';
const uid=()=>Math.random().toString(36).slice(2,9);
const pad=n=>String(n).padStart(2,'0');
const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
const DEVICE=uid();
const dkey=(d=new Date())=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
function defaults(){return{
  world:'canal',
  pomo:{work:25,brk:5,long:15,every:4,cycle:0,isLong:false,mode:'work',endAt:null,remain:1500,task:null},
  sessions:[], doneItems:[], todoSort:'pri',
  chapters:[{id:uid(),name:'1章 序論（例）',target:8,cur:6},{id:uid(),name:'2章 観測システム（例）',target:15,cur:9},{id:uid(),name:'3章 解析手法（例）',target:20,cur:4}], writeUnit:'ページ', writeLog:{},
  papers:[{id:uid(),title:'文献のタイトル（例）',auth:'著者',year:'2024',url:'',status:1,note:'',readAt:null}],
  habits:[{id:uid(),name:'論文を1本読む（例）'},{id:uid(),name:'30分書く（例）'}], habitLog:{}, music:[],
  log:{}, doneLog:{},
  todo:[{id:uid(),t:'3章の図を差し替える（例）',done:false,pri:1,due:'',dl:'',min:0},{id:uid(),t:'測光ログを確認（例）',done:true,pri:2,due:'',dl:'',min:0},{id:uid(),t:'進捗メールを送る（例）',done:false,pri:2,due:'',dl:'',min:0}],
  memo:'思いついたことをここに。\n（モニターをクリックすると開きます）',
  deadlines:[{id:uid(),label:'修論提出（例）',date:'2027-01-29'},{id:uid(),label:'中間発表（例）',date:'2026-11-20'}],
  events:[{id:uid(),date:dkey(),s:'13:00',e:'14:30',t:'ゼミ（例）'}],
  links:[], yt:[], sw:{startedAt:null,acc:0,laps:[]}, calc:[],
  sounds:{master:.6,ch:{rain:.5,fire:0,wave:0,cafe:0,white:0},chime:true,preset:'custom'},
  drink:{type:'ice',at:Date.now(),left:1},
  fx:{wind:0.5,rain:0.6,water:0.5}, win:{weather:'auto',season:'auto',time:null,phase:.5,flowers:null,fdens:.6}, motion:!reduce, savedAt:0
}}
function normalize(o){
  const d=defaults();const S2=Object.assign(d,o||{});
  S2.fx=Object.assign(defaults().fx,(o&&o.fx)||{});
  S2.pomo=Object.assign(defaults().pomo,(o&&o.pomo)||{});
  S2.sounds=Object.assign(defaults().sounds,(o&&o.sounds)||{});S2.sounds.ch=Object.assign(defaults().sounds.ch,((o&&o.sounds)||{}).ch||{});
  S2.drink=Object.assign(defaults().drink,(o&&o.drink)||{});
  S2.win=Object.assign(defaults().win,(o&&o.win)||{});
  if(o&&o.cd&&!o.deadlines)S2.deadlines=[{id:uid(),label:o.cd.label||'締切',date:o.cd.date}];
  delete S2.cd;delete S2.sound;
  S2.todo=S2.todo.map(t=>Object.assign({pri:2,due:'',dl:'',min:0},t));
  return S2;
}
let S;
try{S=normalize(JSON.parse(localStorage.getItem(LS)||'null'))}catch(e){S=defaults()}
const lsSet=()=>{try{localStorage.setItem(LS,JSON.stringify(S))}catch(e){}};
let saveT;function save(){S.savedAt=Date.now();lsSet();clearTimeout(saveT);saveT=setTimeout(push,800)}
const el=(tag,attrs={},...kids)=>{const e=document.createElement(tag);for(const[k,v]of Object.entries(attrs)){if(k==='class')e.className=v;else if(k.startsWith('on'))e.addEventListener(k.slice(2),v);else if(k==='text')e.textContent=v;else if(v!==false&&v!=null)e.setAttribute(k,v===true?'':v)}for(const c of kids.flat(Infinity))if(c!=null&&c!==false)e.append(c);return e};
const svg=(tag,attrs={})=>{const e=document.createElementNS('http://www.w3.org/2000/svg',tag);for(const[k,v]of Object.entries(attrs))e.setAttribute(k,v);return e};

/* ================= sync (PC ⇄ phone) ================= */
let docRef=null,writing=false,pendPush=false,lastSent='',syncState='local',pendingRemote=null;
function setSync(s){syncState=s;statusEl&&(statusEl._h='');tick&&tick()}
async function push(){
  if(!docRef)return;if(writing){pendPush=true;return}
  const json=JSON.stringify(S);if(json===lastSent)return;writing=true;lastSent=json;
  try{await docRef.set({json,savedAt:S.savedAt,device:DEVICE});setSync('ok')}catch(e){lastSent='';setSync('err')}
  writing=false;if(pendPush){pendPush=false;push()}
}
function typing(){const a=document.activeElement;return a&&(a.tagName==='TEXTAREA'||(a.tagName==='INPUT'&&/text|url|number|date|time/.test(a.type)))}
function applyRemote(json){
  if(typing()){pendingRemote=json;return}
  try{S=normalize(JSON.parse(json));lsSet();staticKey='';setWorld(S.world,true);renderPanel();setSync('ok')}catch(e){}
}
document.addEventListener('focusout',()=>setTimeout(()=>{if(pendingRemote&&!typing()){const j=pendingRemote;pendingRemote=null;applyRemote(j)}},50));
async function initSync(){
  let db=null;try{db=await window.claude?.use?.('db')}catch(e){}
  if(!db){setSync('local');return}
  docRef=db.doc('state/main');let first=true;
  docRef.onSnapshot(snap=>{
    if(snap.metadata.hasPendingWrites)return;
    if(!snap.exists){first=false;push();return}
    const d=snap.data();
    if(d.device===DEVICE&&d.json===lastSent){setSync('ok');return}
    if((d.savedAt||0)>(S.savedAt||0)){lastSent=d.json;applyRemote(d.json)}
    else if(first){push()}else setSync('ok');
    first=false;
  },()=>setSync('err'));
}

/* ================= audio: ambient mixer ================= */
const SND={rain:'雨',fire:'焚き火',wave:'波',cafe:'カフェ',river:'川のせせらぎ',bug:'虫の声',bird:'鳥のさえずり',tick:'時計の秒針',murmur:'人のざわめき',talk:'ラジオの話し声',white:'ホワイトノイズ'};
let AC=null,masterG=null,soundsOn=false;const chans={},bufs={};
function ac(){try{AC=AC||new (window.AudioContext||window.webkitAudioContext)();AC.resume();if(!masterG){masterG=AC.createGain();masterG.gain.value=S.sounds.master;masterG.connect(AC.destination)}return AC}catch(e){return null}}
function makeBuf(kind){
  const a=AC,sr=a.sampleRate,sec={cafe:8,wave:9,bug:6,bird:9,river:6,tick:2,train:9,murmur:10,talk:12}[kind]||4,len=Math.floor(sr*sec),b=a.createBuffer(1,len,sr),d=b.getChannelData(0);let l=0,l2=0;
  if(EXTRA_SND[kind]){EXTRA_SND[kind](d,sr,len);return b}
  for(let i=0;i<len;i++){const w=Math.random()*2-1;
    if(kind==='rain'){l=(l+.06*w)/1.06;d[i]=l*3.2+(Math.random()<.0006?Math.random()*.6:0)}
    else if(kind==='white'){l=.85*l+.15*w;d[i]=l*1.2}
    else if(kind==='wave'){l=(l+.02*w)/1.02;const t=i/sr,env=.25+.75*Math.pow(Math.sin(Math.PI*t/sec),2);d[i]=l*6*env}
    else if(kind==='fire'){l=(l+.03*w)/1.03;d[i]=l*2.2}
    else{l=(l+.1*w)/1.1;l2=.9995*l2+.0005*w;d[i]=l*1.6*(.5+Math.min(1,Math.abs(l2)*25))}}
  if(kind==='fire')for(let k=0;k<70;k++){const p=Math.floor(Math.random()*(len-2000)),amp=.2+Math.random()*.8,dec=150+Math.random()*700;for(let j=0;j<dec;j++)d[p+j]+=(Math.random()*2-1)*amp*Math.exp(-j/(dec/5))}
  if(kind==='cafe')for(let k=0;k<5;k++){const p=Math.floor(Math.random()*(len-sr)),f=2200+Math.random()*1500;for(let j=0;j<sr*.25;j++)d[p+j]+=Math.sin(2*Math.PI*f*j/sr)*.1*Math.exp(-j/(sr*.04))}
  const fade=Math.floor(sr*.08);for(let j=0;j<fade;j++){const t=j/fade;d[len-fade+j]=d[len-fade+j]*(1-t)+d[j]*t}
  return b;
}
const FILT={rain:['lowpass',1400],white:['lowpass',5000],wave:['lowpass',800],fire:['lowpass',3200],cafe:['bandpass',900],river:['lowpass',2400],bug:['highpass',2500],bird:['highpass',1400],tick:['highpass',700],train:['lowpass',900],murmur:['lowpass',1200],talk:['lowpass',1500]};
// extra ambiences, synthesised: brook, crickets, birds, a ticking clock, and a distant train (one-shot)
// unintelligible speech, tuned to sound calm: a soft (rounded) glottal wave with a little breath, low and slow,
// spoken in short phrases whose pitch settles downward, with unhurried pauses between them. Two vowel formants, no real words.
function babble(d,sr,len,voices,gain,o={}){const V=[[700,1100],[300,2200],[320,900],[500,1800],[520,850]];
  const f0lo=o.f0lo||95,f0hi=o.f0hi||125,syl0=o.syl0||.14,syl1=o.syl1||.26,pause=o.pause||.7,bw=o.bw||140;
  for(let v=0;v<voices;v++){let t=Math.random()*1.2;const f0b=(v%2&&o.mixed?f0hi+60:f0lo)+Math.random()*(f0hi-f0lo),amp=gain*(.65+Math.random()*.35);
    let y1=0,y2=0,z1=0,z2=0,br=0,ph=0;
    while(t<len/sr-.5){const nSyl=3+Math.floor(Math.random()*6);                                    // one phrase
      for(let q=0;q<nSyl&&t<len/sr-.4;q++){const syl=syl0+Math.random()*(syl1-syl0),st=Math.floor(t*sr),n=Math.floor(syl*sr),[F1,F2]=V[Math.floor(Math.random()*5)],prog=q/nSyl;
        const r=Math.exp(-Math.PI*bw/sr),a1=2*r*Math.cos(2*Math.PI*F1/sr),a2=-r*r,b1=2*r*Math.cos(2*Math.PI*F2/sr),loud=1-.35*prog;
        for(let j=0;j<n&&st+j<len;j++){const u=j/n,f0=f0b*(1-.14*(prog+u/nSyl))*(1+.012*Math.sin(j/sr*11));ph+=f0/sr;if(ph>=1)ph-=1;
          const glott=Math.pow(.5-.5*Math.cos(2*Math.PI*Math.min(1,ph*1.6)),2)-.25;br=.9*br+.1*(Math.random()*2-1);const src=glott+br*.35;
          const env=Math.pow(Math.sin(Math.PI*u),1.3)*loud,y=src*(1-r)+a1*y1+a2*y2;y2=y1;y1=y;const z=src*(1-r)+b1*z1+a2*z2;z2=z1;z1=z;d[st+j]+=(y*.75+z*.25)*env*amp*.9}
        t+=syl+.015+Math.random()*.04}
      t+=pause*(.6+Math.random()*.9)}}}                                                            // an unhurried breath between phrases
const EXTRA_SND={
  murmur(d,sr,len){let l=0;for(let i=0;i<len;i++){l=(l+.05*(Math.random()*2-1))/1.05;d[i]=l*.6}babble(d,sr,len,6,.45,{f0lo:100,f0hi:150,mixed:true,syl0:.12,syl1:.22,pause:.9,bw:170});
    for(let k=0;k<4;k++){const p=Math.floor(Math.random()*(len-sr)),f=1800+Math.random()*1500;for(let j=0;j<sr*.2;j++)d[p+j]+=Math.sin(2*Math.PI*f*j/sr)*.05*Math.exp(-j/(sr*.03))}},   // a room full of people, a cup clinks now and then
  talk(d,sr,len){for(let i=0;i<len;i++)d[i]=(Math.random()*2-1)*.02;babble(d,sr,len,1,1.2,{f0lo:92,f0hi:108,syl0:.16,syl1:.28,pause:.8,bw:130});for(let i=0;i<len;i++)d[i]+=Math.sin(2*Math.PI*50*i/sr)*.004},                       // one late-night radio voice with a little hiss and hum

  river(d,sr,len){let l=0,l2=0;for(let i=0;i<len;i++){const w=Math.random()*2-1;l=(l+.12*w)/1.12;l2=.998*l2+.002*w;d[i]=l*1.4*(.6+Math.min(.8,Math.abs(l2)*18))}
    for(let k=0;k<90;k++){const p=Math.floor(Math.random()*(len-sr*.1)),f0=500+Math.random()*900,dur=sr*(.02+Math.random()*.05),amp=.05+Math.random()*.12;for(let j=0;j<dur;j++){const t=j/sr;d[p+j]+=Math.sin(2*Math.PI*(f0+t*9000)*t)*amp*Math.sin(Math.PI*j/dur)}}},
  bug(d,sr,len){for(let i=0;i<len;i++)d[i]=(Math.random()*2-1)*.01;
    for(let v=0;v<4;v++){const f=3800+v*450+Math.random()*200,per=.45+Math.random()*.5,amp=.12+Math.random()*.1;for(let t0=Math.random()*per;t0<len/sr-.2;t0+=per*(.85+Math.random()*.3)){
      const pulses=2+Math.floor(Math.random()*3);for(let q=0;q<pulses;q++){const st=Math.floor((t0+q*.035)*sr),dur=Math.floor(sr*.022);for(let j=0;j<dur&&st+j<len;j++)d[st+j]+=Math.sin(2*Math.PI*f*j/sr)*amp*Math.sin(Math.PI*j/dur)}}}},
  bird(d,sr,len){for(let i=0;i<len;i++)d[i]=(Math.random()*2-1)*.004;

function drawCalendar(Pl){
  const now=new Date(),y0=CAL.y,x0=CAL.x,m=now.getMonth()+1,Y=now.getFullYear(),neon=S.world==='neon';
  const paper=Pl.cal,ink=neon?'#c9b8f0':'#4a423a',faint=neon?'#352c6e':'#b8b0a0',sun=neon?'#ff6fa8':'#c0483a',sat=neon?'#5ff5d0':'#3a64a8';
  // shadow, nails and string loop
  g.globalAlpha=.15;R(x0+3,y0+3,CAL.w,CAL.h,'#1e160f');g.globalAlpha=1;
  R(x0,y0,CAL.w,CAL.h,paper);R(x0,y0,CAL.w,1,lt(paper,.08));R(x0+CAL.w-1,y0+1,1,CAL.h-1,dk(paper,.08));R(x0,y0+CAL.h-1,CAL.w,1,dk(paper,.12));
  [6,CAL.w-7].forEach(dx=>{R(x0+dx,y0-2,2,4,'#6a6a6a');PX(x0+dx,y0-2,'#9a9a9a')});
  calPicture(x0+1,y0+2,m,neon);R(x0+1,y0+11,CAL.w-2,1,dk(paper,.1));
  // month number and year strip
  digits(x0+2,y0+13,m,Pl.calHead);R(x0+11,y0+15,CAL.w-13,1,dk(paper,.15));
  // weekday colour row
  for(let c=0;c<7;c++)R(x0+1+c*4,y0+19,3,1,c===0?sun:c===6?sat:faint);
  // day grid
  const first=new Date(Y,m-1,1).getDay(),days=new Date(Y,m,0).getDate(),today=now.getDate();
  const evDays=new Set(S.events.filter(e=>e.date&&e.date.startsWith(Y+'-'+pad(m))).map(e=>+e.date.slice(8,10)));
  const dlDays=new Set(S.deadlines.filter(d=>d.date&&d.date.startsWith(Y+'-'+pad(m))).map(d=>+d.date.slice(8,10)));
  for(let d=1;d<=days;d++){const i=first+d-1,c=i%7,r=i/7|0,cx=x0+1+c*4,cy=y0+21+r*3;
    let col=c===0?sun:c===6?sat:ink;if(d<today)col=mix(col,paper,.55);
    R(cx,cy,3,2,col);
    if(d<today)PX(cx+1,cy,paper);                                                  // crossed off
    if(evDays.has(d))PX(cx+1,cy+2,neon?'#ffd166':'#d89a2a');                        // a plan that day
    if(dlDays.has(d)){R(cx,cy,3,2,Pl.calMark);R(cx+2,cy-2,1,2,ink);R(cx+3,cy-2,1,1,Pl.calMark)} // deadline: filled red with a tiny flag
    if(d===today){const ring=neon?'#ffd166':'#d8483a';PX(cx-1,cy-1,ring);R(cx,cy-1,3,1,ring);PX(cx+3,cy-1,ring);R(cx-1,cy,1,2,ring);R(cx+3,cy,1,2,ring);R(cx,cy+2,3,1,ring)}}
  // a deadline further out: a little red tab on the edge with days left
  const nd=nearestDeadline();if(nd&&!dlDays.has(+String(nd.date).slice(8,10))){R(x0+CAL.w,y0+24,2,5,Pl.calMark)}
  if(nextEvent())R(x0-3,y0+2,2,2,Pl.pomoW);
}

    case 6:r(0,0,W,H,'#f0e0a0');r(0,5,W,3,'#6a8a3a');[[1,3],[4,2],[7,3]].forEach(([a,b])=>{r(a,b,2,2,'#f0b020');p(a,b+2,'#4a6a2a')});break;        // sunflowers

function tick(){
  const now=new Date(),p=S.pomo;
  if(soundsOn&&sleepAt&&Date.now()>=sleepAt){if(masterG){masterG.gain.setTargetAtTime(0,AC.currentTime,1.2)}sleepAt=0;setTimeout(()=>{stopSounds();if(masterG)masterG.gain.value=S.sounds.master;renderPanel()},4000)} // おやすみタイマー: fade out
  if(soundsOn&&S.sounds.preset==='auto'&&Date.now()%60000<260)applySounds();
  if(soundsOn&&S.sounds.preset==='auto'&&S.motion&&S.world==='canal'){const n=Math.floor(frame/2200),f=frame%2200;if(f<4&&rnd(n+77)>.2&&tick.lastTrain!==n){tick.lastTrain=n;playOnce('train',.5)}}
  if(p.endAt&&pomoRemain()<=0){finishPhase();return}
  if(dkey()!==lastDay){lastDay=dkey();renderPanel()}
  const q=k=>pBody.querySelector('[data-t="'+k+'"]'),set=(k,v)=>{const e=q(k);if(e)e.textContent=v};
  set('clock',pad(now.getHours())+':'+pad(now.getMinutes())+':'+pad(now.getSeconds()));
  set('date',now.getFullYear()+'年'+(now.getMonth()+1)+'月'+now.getDate()+'日（'+WD[now.getDay()]+'）');
  set('pomo',fmtMS(pomoRemain()));const pb=q('pomobar');if(pb)pb.style.width=(100*(1-pomoRemain()/(modeLen()*60))).toFixed(1)+'%';
  set('sw',fmtSW(S.sw.acc+(S.sw.startedAt?Date.now()-S.sw.startedAt:0)));
  {const e=document.getElementById('pcBody')?.querySelector('[data-t="sw"]');if(e)e.textContent=fmtSW(S.sw.acc+(S.sw.startedAt?Date.now()-S.sw.startedAt:0))}
  const st=pomoState(),nd=nearestDeadline(),ne=nextEvent(),task=p.task&&S.todo.find(t=>t.id===p.task);
  const sync={ok:['同期','PC・スマホ共通',true],local:['保存','この端末のみ'],err:['同期','一時的に失敗']}[syncState];
  const items=[['時刻',pad(now.getHours())+':'+pad(now.getMinutes())],[st==='idle'?'タイマー停止中':st==='work'?'作業中':(p.isLong?'長い休憩':'休憩中'),fmtMS(pomoRemain())+(task&&st==='work'?' '+task.t:''),st!=='idle'],['今日の集中',fmtMin(todayMin())],['ToDo残り',undone()+'件'],
    ne?['次の予定',ne.s+' '+ne.t]:null,nd?[nd.label,nd.left===0?'今日':'あと'+nd.left+'日']:null,[sync[0],sync[1]]].filter(Boolean);
  const h=it=>'<span'+(it[2]?' class="on"':'')+'>'+esc(it[0])+' <b>'+esc(it[1])+'</b></span>';
  const html=items.map(h).join('');
  if(statusEl._h!==html){statusEl.innerHTML=html;statusEl._h=html;hudStatus.innerHTML=[items[1],items[2],items[3]].map(h).join('')}
  if(!pc.hidden){document.getElementById('pcClock').textContent=pad(now.getHours())+':'+pad(now.getMinutes());document.getElementById('pcTask').textContent=st==='idle'?'':(st==='work'?'作業 ':'休憩 ')+fmtMS(pomoRemain());document.getElementById('pcSync').textContent=syncState==='ok'?'⇅':'●'}
}
setInterval(tick,250);

/* ================= boot ================= */
if(!Object.keys(S.writeLog).length)S.writeLog[dkey()]=writeTotal();
setWorld(S.world==='neon'?'neon':'canal',true);fit();tick();initSync();
(async()=>{try{assetsNS=await window.claude?.use?.('assets')}catch(e){}try{downloadsNS=await window.claude?.use?.('downloads')}catch(e){}if(!pc.hidden)renderPC()})();
let last=0;
function loop(t){requestAnimationFrame(loop);const fps=S.motion?12:1;if(t-last<1000/fps)return;last=t;frame++;draw()}
requestAnimationFrame(loop);
})();

</script>

<script>if('serviceWorker' in navigator&&location.protocol==='https:')navigator.serviceWorker.register('sw.js').catch(()=>{})</script>
</body>
</html>
